<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner Admin · ROCKS GUILD GLORY BOT</title><link rel="stylesheet" href="/style.css"></head><body><div class="ambient"></div><main class="wrap adminwrap"><a class="brand" href="/"><img class="brand-logo" src="/assets/rocks-guild-glory-bot-logo.png" alt="ROCKS GUILD GLORY BOT logo"><span>OWNER ADMIN</span></a><section id="adminLogin" class="panel narrow"><p class="eyebrow">RESTRICTED AREA</p><h1>Owner Admin Login</h1><form id="adminLoginForm"><input name="email" type="email" placeholder="Owner email" required><input name="password" type="password" placeholder="Admin password" required><input name="pin" type="password" placeholder="Admin PIN" required><button class="btn">Secure Login</button></form></section><section id="adminApp" class="hidden"><div class="section-head"><h1>Admin Dashboard</h1><button class="small" onclick="adminLogout()">Logout</button></div><div class="stats"><div class="stat"><small>Users</small><b id="statUsers">0</b></div><div class="stat"><small>Pending Payments</small><b id="statPending">0</b></div><div class="stat"><small>Approved Payments</small><b id="statApproved">0</b></div></div><section class="panel"><h2>Payment Verification</h2><div id="payments">Loading…</div></section><section class="panel"><h2>Credit & UPI Settings</h2><form id="settingsForm" class="grid two"><label>Credit price (₹)<input name="creditPrice" type="number" min="1" required></label><label>Max credits/order<input name="maxCredits" type="number" min="1" max="10" required></label><label>UPI ID<input name="upiId" required></label><label>Payee name<input name="upiName" required></label><label class="check"><input name="maintenance" type="checkbox"> Maintenance mode</label><button class="btn">Save Settings</button></form></section><section class="panel"><h2>Users</h2><div id="users">Loading…</div></section><section class="panel"><h2>Announcement</h2><form id="announcementForm"><input name="title" placeholder="Title" required><textarea name="body" placeholder="Message" required></textarea><button class="btn">Publish</button></form></section></section></main><div id="toast" class="toast"></div><script src="/admin.js"></script></body></html>
